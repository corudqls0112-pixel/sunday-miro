<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>생명의 물 미로 게임</title>

<style>
body {margin:0; background:black; color:white; text-align:center;}
canvas {background:black; margin-top:20px;}

#startScreen, #ending {
position:absolute;
top:0; left:0;
width:100%; height:100%;
background:black;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

#ending {display:none;}

#questionBox {
position:absolute;
top:20%; left:50%;
transform:translateX(-50%);
background:#222;
padding:20px;
border-radius:10px;
display:none;
z-index:10;
}

button {margin:5px; padding:10px;}
</style>
</head>

<body>

<div id="startScreen">
<h1>💧 생명의 물</h1>
<p>
예수님께서 우리를 초청하셨습니다.<br><br>
“내가 주는 물을 마시는 자는 영원히 목마르지 아니하리라”<br><br>
이제 우리는 생명의 물을 찾아 미로로 들어갑니다…
</p>
<button onclick="startGame()">들어가기</button>
</div>

<div id="ending">
<h1>🎉 축하합니다!</h1>
<p>당신은 생명의 물을 찾았습니다!</p>
<p>예수님만이 우리의 참된 생명입니다 💧</p>
<button onclick="location.reload()">다시 하기</button>
</div>

<canvas id="game" width="500" height="500"></canvas>
<div id="questionBox"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameStarted=false;
let isQuestionOpen=false;

let player={x:20,y:20,size:14,speed:2};
let satan={x:480,y:480,size:14,speed:2.5,active:false};

let startPos={x:20,y:20};

let keys={};
document.addEventListener("keydown",e=>keys[e.key]=true);
document.addEventListener("keyup",e=>keys[e.key]=false);

function startGame(){
document.getElementById("startScreen").style.display="none";
gameStarted=true;

// 15초 후 사탄 등장
setTimeout(()=>{satan.active=true;},15000);
}

const walls = [

    // 외곽
    {x:0,y:0,w:500,h:10},
    {x:0,y:0,w:10,h:500},
    {x:0,y:490,w:500,h:10},
    {x:490,y:0,w:10,h:500},

    // 1층 가로벽
    {x:50,y:50,w:400,h:10},
    {x:50,y:100,w:350,h:10},
    {x:100,y:150,w:350,h:10},

    // 2층 세로벽
    {x:50,y:50,w:10,h:300},
    {x:150,y:100,w:10,h:300},
    {x:250,y:50,w:10,h:300},
    {x:350,y:100,w:10,h:300},

    // 중간 막힘 구조
    {x:50,y:350,w:200,h:10},
    {x:300,y:350,w:150,h:10},

    // 하단 복잡 구조
    {x:50,y:400,w:300,h:10},
    {x:100,y:450,w:300,h:10},

    {x:100,y:300,w:10,h:100},
    {x:200,y:300,w:10,h:150},
    {x:300,y:300,w:10,h:100},

    // 중앙 막힘 (핵심 길 꼬이게)
    {x:200,y:200,w:100,h:10},
    {x:200,y:200,w:10,h:100},
    {x:290,y:200,w:10,h:100}
];
    
// 방
let rooms=[
{x:440,y:20,solved:false,id:0},
{x:440,y:440,solved:false,id:1},
{x:20,y:440,solved:false,id:2},
{x:230,y:230,solved:false,id:3} // 중앙
];

// 문제
const questions=[
{q:"예수님이 주시는 물은?",a:["달콤","시원","영원히 목마르지 않는다","쓴맛"],correct:2},
{q:"생수의 강은 누구에게?",a:["닮은","외치는","믿는","따르는"],correct:2},
{q:"새로운 피조물은?",a:["아담","부모","예수님","목사님"],correct:2},
{q:"우리는 누구를 원하는가?",short:true}
];

// 충돌
function collide(obj,x,y){
if(x<0||y<0||x+obj.size>500||y+obj.size>500) return true;
for(let w of walls){
if(x<w.x+w.w && x+obj.size>w.x && y<w.y+w.h && y+obj.size>w.y){
return true;
}
}
return false;
}

// 이동
function move(){
if(!gameStarted||isQuestionOpen) return;

let nx=player.x, ny=player.y;
if(keys["ArrowUp"]) ny-=player.speed;
if(keys["ArrowDown"]) ny+=player.speed;
if(keys["ArrowLeft"]) nx-=player.speed;
if(keys["ArrowRight"]) nx+=player.speed;

if(!collide(player,nx,ny)){
player.x=nx; player.y=ny;
}
}

// 😈 사탄 AI
function moveSatan(){
if(!satan.active) return;

let dx=player.x - satan.x;
let dy=player.y - satan.y;

let dist=Math.sqrt(dx*dx+dy*dy);
let nx=satan.x + (dx/dist)*satan.speed;
let ny=satan.y + (dy/dist)*satan.speed;

if(!collide(satan,nx,ny)){
satan.x=nx; satan.y=ny;
}
}

// 충돌 (사탄)
function checkHit(){
let dx=player.x - satan.x;
let dy=player.y - satan.y;
if(Math.abs(dx)<10 && Math.abs(dy)<10){
gameOver();
}
}

// 게임오버
function gameOver(){
alert("😈 사탄에게 잡혔다! 처음부터 다시!");
player.x=startPos.x;
player.y=startPos.y;
satan.x=480; satan.y=480;
satan.active=false;

rooms.forEach(r=>r.solved=false);

setTimeout(()=>{satan.active=true;},15000);
}

// 문제
function openQuestion(id){
isQuestionOpen=true;
let box=document.getElementById("questionBox");
let q=questions[id];

box.innerHTML=`<p>${q.q}</p>`;

if(q.short){
box.innerHTML+=`<input id="answer"><button onclick="checkShort(${id})">확인</button>`;
}else{
q.a.forEach((t,i)=>{
box.innerHTML+=`<button onclick="check(${id},${i})">${t}</button>`;
});
}

box.style.display="block";
}

// 체크
function check(id,choice){
if(choice===questions[id].correct){
rooms[id].solved=true;
closeBox();
}else{
gameOver();
}
}

function checkShort(id){
let val=document.getElementById("answer").value;
if(val.includes("하나님")){
rooms[id].solved=true;
closeBox();
}else{
gameOver();
}
}

function closeBox(){
document.getElementById("questionBox").style.display="none";
isQuestionOpen=false;
}

// 방 체크
function checkRoom(){
if(isQuestionOpen) return;

rooms.forEach(r=>{
if(!r.solved &&
player.x<r.x+30 && player.x+player.size>r.x &&
player.y<r.y+30 && player.y+player.size>r.y){
openQuestion(r.id);
}
});
}

// 승리
function checkWin(){
if(rooms.every(r=>r.solved)){
document.getElementById("ending").style.display="flex";
}
}

// 그리기
function drawPlayer(){
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(player.x+7,player.y+7,7,0,Math.PI*2);
ctx.fill();
}

function drawSatan(){
if(!satan.active) return;
ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(satan.x+7,satan.y+7,7,0,Math.PI*2);
ctx.fill();
}

function drawWalls(){
ctx.fillStyle="#888";
walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));
}

// 빛
function drawLight(){
ctx.fillStyle="rgba(0,0,0,0.95)";
ctx.fillRect(0,0,500,500);

ctx.globalCompositeOperation="destination-out";
let g=ctx.createRadialGradient(player.x+7,player.y+7,20,player.x+7,player.y+7,120);
g.addColorStop(0,"rgba(0,0,0,1)");
g.addColorStop(1,"rgba(0,0,0,0)");

ctx.fillStyle=g;
ctx.beginPath();
ctx.arc(player.x+7,player.y+7,120,0,Math.PI*2);
ctx.fill();

ctx.globalCompositeOperation="source-over";
}

// 루프
function gameLoop(){
ctx.clearRect(0,0,500,500);

if(gameStarted){
move();
moveSatan();

drawWalls();
drawPlayer();
drawSatan();

drawLight();

checkRoom();
checkHit();
checkWin();
}

requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
