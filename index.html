<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>생명의 물 미로 게임</title>

<style>
body {
    margin:0;
    background:black;
    color:white;
    text-align:center;
    font-family:Arial;
}

canvas {
    background:black;
    margin-top:20px;
}

/* 오프닝 */
#startScreen {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

#startScreen h1 {
    font-size:30px;
    margin-bottom:20px;
}

#startScreen p {
    width:320px;
    line-height:1.6;
    margin-bottom:20px;
}

#startScreen button {
    padding:15px 30px;
    font-size:18px;
    cursor:pointer;
}

/* 문제창 */
#questionBox {
    position:absolute;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    background:#222;
    padding:20px;
    border-radius:10px;
    display:none;
    z-index:10;
    width:300px;
}

button {
    margin:5px;
    padding:10px;
    width:90%;
}
</style>
</head>

<body>

<!-- 🎬 오프닝 -->
<div id="startScreen">
    <h1>💧 생명의 물</h1>
    <p>
    어느 날, 예수님께서 우리를 부르셨습니다.<br><br>

    “내가 주는 물을 마시는 자는  
    영원히 목마르지 아니하리라…”<br><br>

    우리는 지금 그 생명의 물을 찾아  
    이 어두운 미로 속으로 들어갑니다.<br><br>

    길은 보이지 않고,  
    선택은 쉽지 않습니다.<br><br>

    과연 우리는 끝까지 가서  
    생명의 물을 발견할 수 있을까요?
    </p>
    <button onclick="startGame()">들어가기</button>
</div>

<canvas id="game" width="500" height="500"></canvas>
<div id="questionBox"></div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let gameStarted = false;

let player = {x:20, y:20, size:14};
let startPos = {x:20, y:20};
let speed = 2;

let keys = {};
let isQuestionOpen = false;

document.addEventListener("keydown", e => keys[e.key]=true);
document.addEventListener("keyup", e => keys[e.key]=false);

function startGame(){
    document.getElementById("startScreen").style.display="none";
    gameStarted = true;
}

/* 🔥 미로 */
const walls = [
    {x:0,y:0,w:500,h:10},
    {x:0,y:0,w:10,h:500},
    {x:0,y:490,w:500,h:10},
    {x:490,y:0,w:10,h:500},

    {x:50,y:50,w:400,h:10},
    {x:50,y:50,w:10,h:350},
    {x:50,y:390,w:350,h:10},
    {x:390,y:100,w:10,h:300},

    {x:100,y:100,w:300,h:10},
    {x:100,y:100,w:10,h:250},
    {x:100,y:350,w:250,h:10},

    {x:150,y:150,w:200,h:10},
    {x:150,y:150,w:10,h:200},
    {x:150,y:350,w:200,h:10},
    {x:340,y:150,w:10,h:200},

    {x:200,y:200,w:100,h:10}
];

/* 방 */
const rooms = [
    {x:440, y:20, solved:false, id:0},
    {x:440, y:440, solved:false, id:1},
    {x:20, y:440, solved:false, id:2},
    {x:230, y:230, solved:false, id:3}
];

/* 문제 */
const questions = [
{
q:"예수님이 주시는 물을 마시면 어떻게 될까요?",
a:["달콤함","시원하다","영원히 목마르지 않는다","쓴맛"],
correct:2
},
{
q:"생수의 강은 누구에게 흐르나요?",
a:["닮은 자","외치는 자","믿는 자","따르는 자"],
correct:2
},
{
q:"누구 안에 있으면 새로운 피조물이 되나요?",
a:["아담","부모님","예수님","목사님"],
correct:2
},
{
q:"우리는 누구를 간절히 원하는가? (단답)",
a:["하나님"],
correct:0,
short:true
}
];

/* 캐릭터 */
function drawPlayer(){
    ctx.fillStyle="#FFD700";
    ctx.beginPath();
    ctx.arc(player.x+7, player.y+7, 7, 0, Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#fff";
    ctx.lineWidth = 2;
    ctx.stroke();
}

/* 벽 */
function drawWalls(){
    ctx.fillStyle="#888";
    walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h));
}

/* 방 */
function drawRooms(){
    rooms.forEach(r=>{
        ctx.fillStyle = r.solved ? "#00ff00" : "#ff4444";
        ctx.fillRect(r.x, r.y, 30, 30);
    });
}

/* 충돌 */
function collide(x,y){
    if(x<0 || y<0 || x+player.size>500 || y+player.size>500) return true;

    for(let w of walls){
        if(x < w.x+w.w && x+player.size > w.x &&
           y < w.y+w.h && y+player.size > w.y){
            return true;
        }
    }
    return false;
}

/* 이동 */
function move(){
    if(!gameStarted || isQuestionOpen) return;

    let nx=player.x, ny=player.y;

    if(keys["ArrowUp"]) ny-=speed;
    if(keys["ArrowDown"]) ny+=speed;
    if(keys["ArrowLeft"]) nx-=speed;
    if(keys["ArrowRight"]) nx+=speed;

    if(!collide(nx,ny)){
        player.x=nx;
        player.y=ny;
    }
}

/* 문제 */
function openQuestion(id){
    isQuestionOpen = true;
    let box = document.getElementById("questionBox");
    let q = questions[id];

    box.innerHTML = `<p>${q.q}</p>`;

    if(q.short){
        box.innerHTML += `<input id="answer"><button onclick="checkShort(${id})">확인</button>`;
    } else {
        q.a.forEach((t,i)=>{
            box.innerHTML += `<button onclick="check(${id},${i})">${t}</button>`;
        });
    }

    box.style.display="block";
}

/* 방 체크 */
function checkRoom(){
    if(!gameStarted || isQuestionOpen) return;

    rooms.forEach(r=>{
        if(!r.solved &&
           player.x < r.x+30 &&
           player.x+player.size > r.x &&
           player.y < r.y+30 &&
           player.y+player.size > r.y){
            openQuestion(r.id);
        }
    });
}

/* 틀림 */
function wrong(){
    alert("❌ 틀렸어요! 처음으로 돌아갑니다!");
    player.x=startPos.x;
    player.y=startPos.y;
    closeBox();
}

/* 정답 */
function check(id,choice){
    if(choice===questions[id].correct){
        alert("🎉 정답!");
        rooms[id].solved=true;
        closeBox();
    } else wrong();
}

function checkShort(id){
    let val=document.getElementById("answer").value;
    if(val.includes("하나님")){
        alert("🎉 정답!");
        rooms[id].solved=true;
        closeBox();
    } else wrong();
}

function closeBox(){
    document.getElementById("questionBox").style.display="none";
    isQuestionOpen=false;
}

/* 🌟 빛 효과 */
function drawLight(){
    ctx.save();

    ctx.fillStyle="rgba(0,0,0,0.95)";
    ctx.fillRect(0,0,500,500);

    ctx.globalCompositeOperation="destination-out";

    let g=ctx.createRadialGradient(
        player.x+7, player.y+7, 20,
        player.x+7, player.y+7, 120
    );

    g.addColorStop(0,"rgba(0,0,0,1)");
    g.addColorStop(1,"rgba(0,0,0,0)");

    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.arc(player.x+7, player.y+7, 120,0,Math.PI*2);
    ctx.fill();

    ctx.restore();
}

/* 승리 */
function checkWin(){
    if(rooms.every(r=>r.solved)){
        alert("💧 생명의 물을 찾았습니다!");
    }
}

/* 루프 */
function gameLoop(){
    ctx.clearRect(0,0,500,500);

    if(gameStarted){
        move();
        drawWalls();
        drawRooms();

        drawLight();   // 어둠 먼저
        drawPlayer();  // 캐릭터 마지막

        checkRoom();
        checkWin();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
